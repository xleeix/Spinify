name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build www bundle
        run: |
          npm install
          npm run prepare:www

      - name: Build Android APK via Capacitor
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          if command -v convert >/dev/null 2>&1; then
            for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              dens="${pair%%:*}"
              sz="${pair##*:}"
              fg_sz=$((sz * 9 / 4))
              dir="android/app/src/main/res/mipmap-${dens}"
              mkdir -p "$dir"
              convert public/pwa-512x512.png -resize "${sz}x${sz}" "$dir/ic_launcher.png"
              convert public/pwa-512x512.png -resize "${sz}x${sz}" "$dir/ic_launcher_round.png"
              convert public/pwa-maskable-512x512.png -resize "${fg_sz}x${fg_sz}" "$dir/ic_launcher_foreground.png"
            done
          fi
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spinify-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
